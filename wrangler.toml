name = "chrome-kush"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Create once with: npx wrangler kv namespace create SAVES
# then paste the id below.
[[kv_namespaces]]
binding = "SAVES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
AMAZON_IAP_ENV = "production"
